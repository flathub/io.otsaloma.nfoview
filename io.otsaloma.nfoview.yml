app-id: io.otsaloma.nfoview
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: nfoview
finish-args:
  - --filesystem=home
  - --filesystem=xdg-music
  - --filesystem=xdg-videos
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
modules:
  - name: nfoview
    buildsystem: simple
    build-commands:
      - make build
      - make PREFIX=/app install
    sources:
      - type: git
        url: https://github.com/otsaloma/nfoview.git
        tag: "2.2"
        commit: 7d168c881ce8d1036b0ef0ac1e1dc4f9eae3d1d7
